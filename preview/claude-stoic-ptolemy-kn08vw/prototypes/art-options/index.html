<!doctype html>
<html><head><meta charset="utf-8"><title>Service Art Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
  body{margin:0;background:#2B2420;color:#FFF7EC;font-family:Nunito,system-ui,sans-serif}
  .wrap{padding:18px 22px;width:1352px}
  h1{font-family:Fredoka,Nunito,sans-serif;font-size:24px;margin:0 0 4px}
  p.sub{margin:0 0 12px;color:#D9C7B4;font-weight:700}
  svg{display:block;border-radius:18px}
  svg text{font-family:Nunito,sans-serif}
</style></head>
<body><div class="wrap" id="root"></div>
<script>
// ======================= shared =======================
const OUT = '#3A2A1E', W = 1352, H = 600, OX = 200, RX = 210, RY = 14, RW = W - RX - 14, RH = H - 28, KX = 1040, KR = RX + RW;
const AY = [262, 322], AYc = 292, QY = 314, SY = RY + 186, SC = (KX + KR) / 2, SXs = SC - 80, DY = RY + RH - 150;
const Q = new URLSearchParams(location.search);
const FACE = Q.get('face') || 'A';
const P1 = '#2546F0', P2 = '#D61F69';

// ======================= characters =======================
// Every character is drawn standing at (0,0) = feet, facing the camera, ~64 units tall.
const FUR = {
  cat:   { fur: '#A9A9B6', dark: '#7E7E8E', inner: '#F3A9BA', muzzle: '#F4F1F6' },
  dog:   { fur: '#F7DFB8', dark: '#E39E5C', inner: '#E39E5C', muzzle: '#FFF6E8' },
  bunny: { fur: '#F7F1E8', dark: '#E6DBCB', inner: '#F6B3C3', muzzle: '#FFFFFF' }
};
function ears(k, c, sw) {
  if (k === 'cat') return `<path d="M-12.5 -45 L-11 -60 Q-6 -57 -2 -52 Z M12.5 -45 L11 -60 Q6 -57 2 -52 Z" fill="${c.fur}" stroke="${OUT}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M-10.3 -48 L-9.6 -56 Q-6.8 -54 -4.6 -51.5 Z M10.3 -48 L9.6 -56 Q6.8 -54 4.6 -51.5 Z" fill="${c.inner}"/>`;
  if (k === 'bunny') return `<g stroke="${OUT}" stroke-width="${sw}"><path d="M-9 -50 C-15 -66 -12 -80 -6.5 -79 C-1.5 -78 -1.5 -64 -3 -51 Z" fill="${c.fur}"/><path d="M9 -50 C15 -66 12 -80 6.5 -79 C1.5 -78 1.5 -64 3 -51 Z" fill="${c.fur}"/></g><path d="M-7.5 -53 C-11 -64 -9.5 -73 -6.8 -73 C-4.2 -73 -4.2 -64 -5 -54 Z M7.5 -53 C11 -64 9.5 -73 6.8 -73 C4.2 -73 4.2 -64 5 -54 Z" fill="${c.inner}"/>`;
  return '';
}
function dogEars(c, sw) {
  return `<path d="M-11 -50 C-20 -50 -21 -38 -17 -30 C-15 -27 -11 -29 -11 -33 Z M11 -50 C20 -50 21 -38 17 -30 C15 -27 11 -29 11 -33 Z" fill="${c.dark}" stroke="${OUT}" stroke-width="${sw}" stroke-linejoin="round"/>`;
}
// face styles
function face(k, style, c) {
  let f = '';
  const blush = (rx, ry, dy, x) => `<ellipse cx="${-x}" cy="${dy}" rx="${rx}" ry="${ry}" fill="#F48FA3" opacity=".55"/><ellipse cx="${x}" cy="${dy}" rx="${rx}" ry="${ry}" fill="#F48FA3" opacity=".55"/>`;
  if (style === 'A') { // soft: tall shiny eyes, :3 mouths
    if (k !== 'bunny') f += `<ellipse cy="-33.5" rx="7.5" ry="5" fill="${c.muzzle}"/>`;
    f += `<ellipse cx="-5.2" cy="-40" rx="2.4" ry="3.3" fill="${OUT}"/><ellipse cx="5.2" cy="-40" rx="2.4" ry="3.3" fill="${OUT}"/><circle cx="-4.4" cy="-41.3" r="1" fill="#fff"/><circle cx="6" cy="-41.3" r="1" fill="#fff"/>`;
    f += blush(3.2, 2, -34.5, 9);
    if (k === 'cat') f += `<path d="M-1.5 -36.4 h3 l-1.5 1.7 z" fill="#E77D97"/><path d="M-3.2 -33.6 q1.6 2 3.2 0 q1.6 2 3.2 0" stroke="${OUT}" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M-9 -35 l-6 -1 M-9 -33.5 l-6 1 M9 -35 l6 -1 M9 -33.5 l6 1" stroke="${OUT}" stroke-width=".8" opacity=".7"/>`;
    if (k === 'dog') f += `<ellipse cy="-36.2" rx="2.2" ry="1.6" fill="${OUT}"/><path d="M-3.6 -33.8 q3.6 4.6 7.2 0 z" fill="#B23A48" stroke="${OUT}" stroke-width="1"/><ellipse cy="-31.3" rx="1.7" ry="1.1" fill="#F48FA3"/>`;
    if (k === 'bunny') f += `<path d="M-1.4 -36.2 h2.8 l-1.4 1.5 z" fill="#E77D97"/><path d="M-2.6 -33.8 q1.3 1.4 2.6 0 q1.3 1.4 2.6 0" stroke="${OUT}" stroke-width="1.1" fill="none" stroke-linecap="round"/><rect x="-1.4" y="-33" width="2.8" height="2.2" rx=".6" fill="#fff" stroke="${OUT}" stroke-width=".7"/>`;
  } else if (style === 'B') { // sticker: confident half-lidded eyes, brows, bigger expressions (closest to the key art)
    if (k !== 'bunny') f += `<ellipse cy="-33.5" rx="7.8" ry="5.2" fill="${c.muzzle}"/>`;
    if (k === 'cat') {
      f += `<path d="M-8 -40.5 q3 -2.6 6 0 M2 -40.5 q3 -2.6 6 0" stroke="${OUT}" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="-5" cy="-39.4" rx="1.6" ry="1.4" fill="${OUT}"/><ellipse cx="5" cy="-39.4" rx="1.6" ry="1.4" fill="${OUT}"/>`;
      f += `<path d="M-8 -44.5 l5 1 M8 -44.5 l-5 1" stroke="${OUT}" stroke-width="1.3" stroke-linecap="round"/><path d="M-1.5 -36.4 h3 l-1.5 1.7 z" fill="#E77D97"/><path d="M-3.5 -33.4 q1.8 1.8 3.5 0 q1.8 2.6 4 -0.6" stroke="${OUT}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
    } else if (k === 'dog') {
      f += `<path d="M-8.5 -44 l5 1.6 M8.5 -44 l-5 1.6" stroke="${OUT}" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="-5" cy="-39.6" rx="2" ry="2.4" fill="${OUT}"/><ellipse cx="5" cy="-39.6" rx="2" ry="2.4" fill="${OUT}"/><circle cx="-4.3" cy="-40.6" r=".8" fill="#fff"/><circle cx="5.7" cy="-40.6" r=".8" fill="#fff"/>`;
      f += `<ellipse cy="-36.2" rx="2.3" ry="1.7" fill="${OUT}"/><path d="M-4.5 -34 q4.5 6 9 0 z" fill="#B23A48" stroke="${OUT}" stroke-width="1.1"/><path d="M-2 -31.4 q2 2.4 4 0" fill="#F48FA3"/>`;
    } else {
      f += `<path d="M-7.5 -39 q2.4 -2.8 4.8 0 M2.7 -39 q2.4 -2.8 4.8 0" stroke="${OUT}" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-1.4 -36.2 h2.8 l-1.4 1.5 z" fill="#E77D97"/><path d="M-3 -33.6 q3 3 6 0" stroke="${OUT}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
    }
    f += blush(3, 1.8, -34.6, 9.2);
  } else { // C button: simple dots, low wide eyes, big blush
    if (k !== 'bunny') f += `<ellipse cy="-33" rx="6.5" ry="4.4" fill="${c.muzzle}"/>`;
    f += `<circle cx="-6" cy="-37.6" r="1.9" fill="${OUT}"/><circle cx="6" cy="-37.6" r="1.9" fill="${OUT}"/>`;
    f += blush(3.8, 2.6, -33.6, 9.5);
    if (k === 'cat') f += `<path d="M-1.2 -35.4 h2.4 l-1.2 1.3 z" fill="#E77D97"/><path d="M-2 -32.8 q1 1.2 2 0 q1 1.2 2 0" stroke="${OUT}" stroke-width="1" fill="none"/>`;
    if (k === 'dog') f += `<ellipse cy="-35.2" rx="1.8" ry="1.3" fill="${OUT}"/><path d="M-2 -32.8 q2 2.2 4 0" stroke="${OUT}" stroke-width="1.1" fill="none"/>`;
    if (k === 'bunny') f += `<path d="M-1.1 -35.2 h2.2 l-1.1 1.2 z" fill="#E77D97"/><path d="M-1.8 -32.8 q1.8 1.6 3.6 0" stroke="${OUT}" stroke-width="1" fill="none"/>`;
  }
  return f;
}
function body(o, sw) {
  // legs + feet, torso, arms
  const pants = o.pants || '#3D405B', shirt = o.shirt, skin = o.skin;
  let g = `<ellipse rx="15" ry="4.6" cy="1.5" fill="rgba(40,25,10,.25)"/>`;
  g += `<path d="M-8.5 -12 v9 a3.5 3.5 0 0 0 7 0 v-9 Z M1.5 -12 v9 a3.5 3.5 0 0 0 7 0 v-9 Z" fill="${pants}" stroke="${OUT}" stroke-width="${sw}"/>`;
  g += `<ellipse cx="-5" cy="0" rx="5" ry="2.6" fill="${o.shoe || '#2B2420'}"/><ellipse cx="5" cy="0" rx="5" ry="2.6" fill="${o.shoe || '#2B2420'}"/>`;
  g += `<path d="M-13 -9 C-13 -24 -8 -30 0 -30 C8 -30 13 -24 13 -9 Q0 -5 -13 -9 Z" fill="${shirt}" stroke="${OUT}" stroke-width="${sw}"/>`;
  return g;
}
function arms(o, sw) {
  return `<path d="M-12 -24 Q-17 -18 -15.5 -12" stroke="${OUT}" stroke-width="${sw + 5.5}" stroke-linecap="round" fill="none"/><path d="M-12 -24 Q-17 -18 -15.5 -12" stroke="${o.shirt}" stroke-width="5.5" stroke-linecap="round" fill="none"/><circle cx="-15.5" cy="-11.5" r="3.6" fill="${o.skin}" stroke="${OUT}" stroke-width="${sw * .8}"/>`
    + (o.tray ? `<path d="M12 -24 Q18 -26 19 -32" stroke="${OUT}" stroke-width="${sw + 5.5}" stroke-linecap="round" fill="none"/><path d="M12 -24 Q18 -26 19 -32" stroke="${o.shirt}" stroke-width="5.5" stroke-linecap="round" fill="none"/><ellipse cx="20" cy="-35" rx="11" ry="3.4" fill="#D8DEE4" stroke="${OUT}" stroke-width="1.2"/><circle cx="19.5" cy="-33" r="3.2" fill="${o.skin}" stroke="${OUT}" stroke-width="${sw * .8}"/>`
      : `<path d="M12 -24 Q17 -18 15.5 -12" stroke="${OUT}" stroke-width="${sw + 5.5}" stroke-linecap="round" fill="none"/><path d="M12 -24 Q17 -18 15.5 -12" stroke="${o.shirt}" stroke-width="5.5" stroke-linecap="round" fill="none"/><circle cx="15.5" cy="-11.5" r="3.6" fill="${o.skin}" stroke="${OUT}" stroke-width="${sw * .8}"/>`);
}
function head(k, style, c, sw) {
  const r = style === 'C' ? 14.5 : 13;
  let g = ears(k, c, sw);
  g += `<ellipse cy="-40" rx="${r + .5}" ry="${r}" fill="${c.fur}" stroke="${OUT}" stroke-width="${sw}"/>`;
  if (k === 'cat') g += `<path d="M-3 -52 l1 4 M0 -52.6 v4.4 M3 -52 l-1 4" stroke="${c.dark}" stroke-width="1.6" stroke-linecap="round"/>`;
  if (k === 'bunny') g += `<path d="M-3 -52.5 q3 -3.5 6 0 q-3 -1.2 -6 0" fill="${c.fur}" stroke="${OUT}" stroke-width="1"/>`;
  if (k === 'dog') g += dogEars(c, sw);
  return g;
}
function chef(k, color, style) {
  const c = FUR[k], sw = style === 'B' ? 2 : 1.6, o = { shirt: '#FFFFFF', skin: c.fur, pants: '#3D405B' };
  let g = body(o, sw);
  // chef jacket buttons + coloured apron + neckerchief
  g += `<path d="M-9 -22 h18 v12 q-9 4 -18 0 Z" fill="${color}" stroke="${OUT}" stroke-width="1.3"/><path d="M-9 -22 l-3 -5 M9 -22 l3 -5" stroke="${OUT}" stroke-width="1.2"/>`;
  g += `<circle cx="-3" cy="-26" r="1" fill="${OUT}"/><circle cx="3" cy="-26" r="1" fill="${OUT}"/>`;
  g += arms(o, sw);
  const hat = `<g stroke="${OUT}" stroke-width="1.5"><rect x="-11" y="-60" width="22" height="9" rx="2.5" fill="#FFFFFF"/><circle cx="-8" cy="-64" r="7" fill="#FFFFFF"/><circle cx="8" cy="-64" r="7" fill="#FFFFFF"/><circle cx="0" cy="-68" r="8.5" fill="#FFFFFF"/></g><rect x="-10.3" y="-59.3" width="20.6" height="7.6" fill="#FFFFFF"/><path d="M-6 -56 v3 M0 -56 v3 M6 -56 v3" stroke="#E4DCD0" stroke-width="1.2"/>`;
  if (k === 'cat') g += hat;
  g += head(k, style, c, sw);
  g += `<path d="M-9 -29.5 q9 6 18 0 l-2 4 q-7 3 -14 0 Z" fill="${color}" stroke="${OUT}" stroke-width="1.2"/><path d="M-2 -27 l2 6 l2 -6 Z" fill="${color}" stroke="${OUT}" stroke-width="1"/>`;
  g += face(k, style, c);
  if (k !== 'cat') g += hat;
  return g;
}
function bunny(style, back, tray) {
  const c = FUR.bunny, sw = style === 'B' ? 2 : 1.6, o = { shirt: '#3F5E4A', skin: c.fur, pants: '#2F4537', tray };
  let g = body(o, sw);
  if (back) {
    g += `<path d="M-6 -29 L-3 -11 M6 -29 L3 -11" stroke="#FFF7EC" stroke-width="2.2"/><path d="M0 -14 l-7 -4 v8 z M0 -14 l7 -4 v8 z" fill="#FFF7EC" stroke="${OUT}" stroke-width="1"/>` + arms(o, sw);
    g += ears('bunny', c, sw) + `<ellipse cy="-40" rx="13.5" ry="13" fill="${c.fur}" stroke="${OUT}" stroke-width="${sw}"/><circle cy="-9" r="3.6" fill="#FFFFFF" stroke="${OUT}" stroke-width="1"/>`;
    return g;
  }
  g += `<path d="M-8 -23 h16 v13 q-8 3.5 -16 0 Z" fill="#FFF7EC" stroke="${OUT}" stroke-width="1.2"/><path d="M-3 -18 h6" stroke="#E6DBCB" stroke-width="1.4"/>`;
  g += arms(o, sw) + head('bunny', style, c, sw);
  g += `<path d="M0 -28 l-5 -2.6 v5.2 Z M0 -28 l5 -2.6 v5.2 Z" fill="#E76F51" stroke="${OUT}" stroke-width="1"/><circle cy="-28" r="1.4" fill="#E76F51" stroke="${OUT}" stroke-width=".8"/>`;
  g += face('bunny', style, c);
  return g;
}
function pawn(col, seated) {
  let q = '';
  if (!seated) q += `<ellipse rx="14" ry="4.5" cy="1" fill="rgba(40,25,10,.25)"/><rect x="-8.5" y="-11" width="7" height="12" rx="3" fill="${col}" stroke="${OUT}" stroke-width="1.4"/><rect x="1.5" y="-11" width="7" height="12" rx="3" fill="${col}" stroke="${OUT}" stroke-width="1.4"/>`;
  q += `<path d="M-13 -8 q0 -22 13 -22 q13 0 13 22 z" fill="${col}" stroke="${OUT}" stroke-width="1.6"/><circle cy="-40" r="11.5" fill="${col}" stroke="${OUT}" stroke-width="1.6"/><ellipse cx="-4" cy="-44" rx="4" ry="2.4" fill="#FFFFFF" opacity=".35"/>`;
  return q;
}
const at = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;

// ======================= character sheet =======================
function sheet() {
  const styles = [['A', 'A · Soft', 'Tall shiny eyes, ":3" mouths, round blush. Cute and calm.'],
                  ['B', 'B · Sticker', 'Half-lidded confident eyes and brows, closest to the key art.'],
                  ['C', 'C · Button', 'Dot eyes set low and wide, bigger head. Simplest at small sizes.']];
  const h = 300 * styles.length + 40;
  let g = `<rect width="${W}" height="${h}" fill="#F3E9DA"/>`;
  styles.forEach(([st, name, note], r) => {
    const y0 = 20 + r * 300;
    g += `<rect x="16" y="${y0}" width="${W - 32}" height="280" rx="18" fill="#FFF7EC" stroke="${OUT}" stroke-width="2"/>`;
    g += `<text x="40" y="${y0 + 40}" font-size="24" font-weight="900" fill="${OUT}">${name}</text><text x="40" y="${y0 + 64}" font-size="14" font-weight="700" fill="#7A5A40">${note}</text>`;
    const big = [chef('cat', P1, st), chef('dog', P2, st), bunny(st, false, true), bunny(st, true, false)];
    const labels = ['Cat chef (P1)', 'Dog chef (P2)', 'Bunny staff', 'Bunny, back view'];
    big.forEach((ch, i) => { const x = 140 + i * 210; g += at(x, y0 + 252, 2.2, ch) + `<text x="${x}" y="${y0 + 274}" text-anchor="middle" font-size="13" font-weight="800" fill="#7A5A40">${labels[i]}</text>`; });
    // game size, on the floor
    g += `<rect x="${980}" y="${y0 + 90}" width="330" height="170" rx="14" fill="#C99A6B" stroke="${OUT}" stroke-width="1.6"/><text x="1145" y="${y0 + 84}" text-anchor="middle" font-size="12" font-weight="800" fill="#7A5A40">in-game size</text>`;
    g += at(1030, y0 + 230, 1.25, chef('cat', P1, st)) + at(1100, y0 + 230, 1.25, chef('dog', P2, st)) + at(1170, y0 + 230, 1, bunny(st, false, true)) + at(1230, y0 + 230, 1, bunny(st, true)) + at(1285, y0 + 230, 1, pawn('#B8A99A'));
  });
  return `<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}">${g}</svg>`;
}

// ======================= scene pieces =======================
const DEFS = `<defs>
  <pattern id="woodA" width="140" height="40" patternUnits="userSpaceOnUse"><rect width="140" height="40" fill="#C99A6B"/><rect y="20" width="140" height="20" fill="#C1915F"/><path d="M0 20 H140 M0 40 H140" stroke="#A97B4F" stroke-width="2"/><path d="M60 0 V20 M130 20 V40 M30 20 V40" stroke="#A97B4F" stroke-width="2"/><path d="M8 9 q18 -3 36 0 M84 30 q20 -3 40 0" stroke="#B88A5B" stroke-width="1.2" fill="none"/><circle cx="100" cy="10" r="1.6" fill="#9C7046"/></pattern>
  <pattern id="woodB" width="120" height="30" patternUnits="userSpaceOnUse"><rect width="120" height="30" fill="#DDBB8E"/><rect y="15" width="120" height="15" fill="#D5B183"/><path d="M0 15 H120 M0 30 H120 M40 0 V15 M100 15 V30" stroke="#C09A6B" stroke-width="1.6"/></pattern>
  <pattern id="gingham" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFF7EC"/><rect width="5" height="10" fill="#E76F51" opacity=".45"/><rect width="10" height="5" fill="#E76F51" opacity=".45"/></pattern>
  <pattern id="sage" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFF7EC"/><circle cx="5" cy="5" r="1.4" fill="#84A98C"/></pattern>
  <pattern id="terracotta" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#E3A47F"/><rect x="1.5" y="1.5" width="15" height="15" rx="2" fill="#D9936C"/><rect x="19.5" y="19.5" width="15" height="15" rx="2" fill="#D9936C"/><path d="M0 18 H36 M18 0 V36" stroke="#C9805B" stroke-width="1.6"/></pattern>
  <pattern id="flagstone" width="64" height="48" patternUnits="userSpaceOnUse"><rect width="64" height="48" fill="#CFC3AE"/><path d="M0 0 L22 2 L26 20 L4 24 Z M28 0 L62 4 L58 22 L30 20 Z M2 28 L28 24 L34 46 L6 48 Z M38 26 L62 26 L64 48 L36 46 Z" fill="#DCD2C0" stroke="#B7A98F" stroke-width="1.5"/></pattern>
  <pattern id="dirt" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#D7B98A"/><circle cx="8" cy="10" r="2" fill="#C2A06F"/><circle cx="28" cy="26" r="1.6" fill="#C2A06F"/><circle cx="20" cy="6" r="1.2" fill="#E6CDA3"/></pattern>
  <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#8DB87A"/><path d="M6 12 l2 -6 l2 6 M26 30 l2 -6 l2 6 M30 8 l1.5 -5 l1.5 5" stroke="#6F9E5E" stroke-width="1.6" fill="none"/></pattern>
  <pattern id="meadow" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#9CC283"/><path d="M6 14 l2 -6 l2 6 M30 36 l2 -6 l2 6" stroke="#7DAA67" stroke-width="1.6" fill="none"/><circle cx="38" cy="10" r="2" fill="#FFF7EC"/><circle cx="38" cy="10" r=".8" fill="#F4B740"/><circle cx="14" cy="38" r="1.8" fill="#F6B3C3"/></pattern>
  <pattern id="terrazzo" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#E6E2DC"/><circle cx="8" cy="12" r="2.2" fill="#C9C2B8"/><circle cx="30" cy="40" r="1.6" fill="#E76F51" opacity=".55"/><circle cx="46" cy="16" r="2" fill="#7E8C9A" opacity=".6"/><circle cx="18" cy="50" r="1.4" fill="#2A9D8F" opacity=".5"/><circle cx="52" cy="48" r="2.4" fill="#C9C2B8"/></pattern>
  <pattern id="slab" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#E7E5E1"/><path d="M0 70 V0 H70" stroke="#D2CEC8" stroke-width="2" fill="none"/><path d="M35 0 V70" stroke="#DDD9D3" stroke-width="1"/></pattern>
  <pattern id="asphaltM" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#4A4D57"/><circle cx="7" cy="9" r=".9" fill="#5A5D67"/><circle cx="21" cy="23" r="1" fill="#41444D"/></pattern>
  <linearGradient id="led" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFE08A"/></linearGradient>
  <pattern id="herringL" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#C99D72"/><path d="M0 20 L20 0 L40 20 L20 40 Z" fill="#D2A87D"/><path d="M0 20 L20 0 M20 40 L40 20 M0 0 L40 40" stroke="#B48760" stroke-width="1.4"/></pattern>
  <pattern id="herring" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#8A5A3C"/><path d="M0 20 L20 0 L40 20 L20 40 Z" fill="#94633F"/><path d="M0 20 L20 0 M20 40 L40 20 M0 0 L40 40" stroke="#6F4630" stroke-width="1.6"/></pattern>

  g += `<path d="M18 0 V${H}" stroke="#F2F2EE" stroke-width="3" stroke-dasharray="22 20" opacity=".8"/>`;
  g += `<rect x="58" width="24" height="${H}" fill="#3FA796"/><path d="M58 0 V${H} M82 0 V${H}" stroke="#FFFFFF" stroke-width="2"/>`;
  [120, 460].forEach(y => g += `<g transform="translate(70 ${y})" stroke="#FFFFFF" stroke-width="1.6" fill="none"><circle cx="-5" cy="4" r="4"/><circle cx="5" cy="4" r="4"/><path d="M-5 4 L-1 -3 L4 -3 L5 4 M-1 -3 L0 4"/></g>`);
  g += `<rect x="82" width="5" height="${H}" fill="#BDB8B1"/>`;
  // wide zebra crossing in front of the door
  for (let x = 2; x < 56; x += 11) g += `<rect x="${x}" y="${AY[0] - 10}" width="7" height="${AY[1] - AY[0] + 20}" rx="1.5" fill="#F2F2EE" opacity=".9"/>`;
  // slim street lights with LED bars reaching over the road
  [[96, 60], [96, 540]].forEach(([x, y]) => g += `<g transform="translate(${x} ${y})"><ellipse cx="-50" cy="6" rx="38" ry="14" fill="url(#glow)"/><ellipse cy="4" rx="6" ry="2.4" fill="rgba(0,0,0,.25)"/><rect x="-2" y="-40" width="4" height="44" rx="2" fill="#2F3440"/><rect x="-62" y="-42" width="64" height="3.5" rx="1.7" fill="#2F3440"/><rect x="-66" y="-44" width="24" height="7" rx="3.5" fill="url(#led)" stroke="${OUT}" stroke-width="1"/></g>`);
  // bollards along the curb
  for (let y = 30; y < H; y += 72) if (Math.abs(y - AYc) > 50) g += `<circle cx="96" cy="${y + 16}" r="4.5" fill="#2F3440" stroke="${OUT}" stroke-width="1"/><circle cx="95" cy="${y + 15}" r="1.6" fill="#8A8F99"/>`;
  // A-frame menu board by the door
  g += `<g transform="translate(176 ${AY[1] + 44})"><ellipse cy="14" rx="14" ry="4" fill="rgba(0,0,0,.2)"/><path d="M-12 12 L-8 -16 H8 L12 12 Z" fill="#2F3440" stroke="${OUT}" stroke-width="1.3"/><path d="M-5 -9 h10 M-6 -3 h12 M-5 3 h9" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></g>`;
  // flat teal canopy over the door and a small neon OPEN on the glass
  // teal-and-white striped awning over the door (as in the first bistro version)
  for (let i = 0; i < 7; i++) g += `<path d="M186 ${AY[0] - 70 + i * 22} h22 v20 h-22 Z" fill="${i % 2 ? '#FFF7EC' : '#2A9D8F'}" stroke="${OUT}" stroke-width="1"/>`;
  g += `<g transform="translate(150 ${AY[0] - 34})"><circle r="28" fill="url(#neon)"/><rect x="-26" y="-10" width="52" height="20" rx="8" fill="#2F3440" stroke="#FF5FA2" stroke-width="2.4"/><text y="4.5" text-anchor="middle" font-size="11" font-weight="900" fill="#FFD1E5" letter-spacing="1.6">OPEN</text></g>`;
  return g;
}
function wildOutside() {
  let g = `<rect width="${OX + 20}" height="${H}" fill="url(#meadow)"/>`;
  // the flagstone path from the Cottage garden version
  g += `<path d="M60 ${H} C 40 460, 120 400, 96 ${AYc + 30} S 110 120, 70 0 L 140 0 C 170 120, 150 220, 170 ${AYc + 30} S 110 470, 140 ${H} Z" fill="url(#flagstone)" stroke="#B7A98F" stroke-width="2"/>`;
  // wildflower and long-grass clumps where the beds and hedges were
  [[22, 60, 1.2], [186, 70, 1.1], [24, 170, 1], [26, 250, .9], [190, 380, 1.2], [22, 360, 1.1], [24, 470, 1.2], [188, 520, 1.1], [30, 575, 1], [190, 590, .9]]
    .forEach(([x, y, sc], i) => g += wild(x, y, sc, i));
  // wooden lantern posts
  [[194, 196], [150, 470]].forEach(([x, y]) => g += `<g transform="translate(${x} ${y})"><circle cy="-30" r="22" fill="url(#glow)"/><rect x="-3" y="-26" width="6" height="42" fill="#7A4A2A" stroke="${OUT}" stroke-width="1"/><rect x="-8" y="-42" width="16" height="16" rx="4" fill="#FFE08A" stroke="${OUT}" stroke-width="1.4"/><path d="M-9 -42 L0 -48 L9 -42 Z" fill="#7A4A2A"/></g>`);
  // wooden arch with wild roses over the path to the door
  g += `<path d="M140 ${AY[0] - 4} C 140 ${AY[0] - 66}, 204 ${AY[0] - 66}, 204 ${AY[0] - 4}" stroke="#7A4A2A" stroke-width="6" fill="none"/>`;
  for (let i = 0; i < 9; i++) { const t = i / 8, x = 140 + 64 * t, y = AY[0] - 4 - Math.sin(Math.PI * t) * 48; g += `<circle cx="${x}" cy="${y}" r="5" fill="#5E9150"/><circle cx="${x + 2}" cy="${y - 2}" r="3.2" fill="${i % 2 ? '#F28482' : '#FFFFFF'}" stroke="${OUT}" stroke-width=".7"/>`; }
  return g;
}
function interiorDecor(id) {
  const modern = id.startsWith('city3');
  id = BASE[id] || id;
  let g = '';
  if (id === 'country1') {
    // chalkboard menu by the door, barrels, plants in corners, hanging lanterns over the aisle
    g += `<g transform="translate(${RX + 40} ${AY[1] + 30})"><path d="M-14 22 L-10 -18 M14 22 L10 -18" stroke="#7A4A2A" stroke-width="3"/><rect x="-16" y="-22" width="32" height="30" rx="3" fill="#2F3B2F" stroke="#7A4A2A" stroke-width="3"/><path d="M-9 -12 h18 M-9 -5 h12 M-9 2 h15" stroke="#FFF7EC" stroke-width="1.6" stroke-linecap="round"/></g>`;
    for (let x = RX + 120; x < KX - 40; x += 160) g += `<g transform="translate(${x} ${AYc - 10})"><path d="M0 -24 V-12" stroke="${OUT}" stroke-width="1"/><circle cy="0" r="18" fill="url(#glow)"/><rect x="-6" y="-12" width="12" height="14" rx="3" fill="#FFE08A" stroke="${OUT}" stroke-width="1.2"/></g>`;
    g += plant(RX + 18, AY[1] + 4, .7, '#C4693F') + plant(KX - 24, RY + RH - 10, .9, '#C4693F');
  } else if (id === 'country2') {
    for (let x = RX + 30; x < KX - 20; x += 60) g += `<path d="M${x} ${RY + 6} q12 16 24 0" stroke="#5C9A5A" stroke-width="3" fill="none"/><circle cx="${x + 6}" cy="${RY + 12}" r="3" fill="#6FAE63"/><circle cx="${x + 18}" cy="${RY + 12}" r="3" fill="#6FAE63"/>`;
    g += plant(RX + 24, AYc + 2, .8, '#E9DFD3') + plant(KX - 26, AYc + 2, .8, '#E9DFD3');
  } else if (id === 'city1') {
    // neon OPEN sign + pendant lights
    if (!modern) g += `<g transform="translate(122 ${AY[1] + 36})"><circle r="44" fill="url(#neon)"/><rect x="-34" y="-14" width="68" height="28" rx="10" fill="none" stroke="#FF5FA2" stroke-width="3"/><text y="6" text-anchor="middle" font-size="15" font-weight="900" fill="#FFD1E5" letter-spacing="2" font-family="Nunito,sans-serif">OPEN</text></g>`;
    for (let x = RX + 190; x < KX - 40; x += 150) g += `<g transform="translate(${x} ${AYc})"><circle r="26" fill="url(#glow)"/><circle r="9" fill="#2B2B30" stroke="${OUT}" stroke-width="1.2"/><circle r="4" fill="#FFE08A"/></g>`;
    g += plant(KX - 26, RY + RH - 10, 1, '#2B2B30');
  } else {
    // coffee counter by the door + big plants
    g += plant(RX + 30, RY + RH - 10, 1.2, '#FFFFFF') + plant(KX - 30, RY + 40, 1.1, '#FFFFFF') + plant(KX - 30, RY + RH - 10, 1.2, '#FFFFFF');
  }
  return g;
}
function kitchen(id, plates) {
  id = BASE[id] || id;
  let k = `<text x="${SC}" y="${RY + 34}" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#7A5A40">KITCHEN</text>`;
  const city = id.startsWith('city');
  const counter = city ? '#C9D1D6' : '#B08D6E', counterIn = city ? '#E6EBEE' : '#D9C3A5';
  k += `<rect x="${KX + 24}" y="${RY + 46}" width="${KR - KX - 48}" height="88" rx="10" fill="${counter}" stroke="${OUT}" stroke-width="1.8"/><rect x="${KX + 30}" y="${RY + 52}" width="${KR - KX - 60}" height="76" rx="7" fill="${counterIn}"/>`;
  for (let j = 0; j < plates; j++) k += plate(KX + 54 + (j % 6) * 38, RY + 68 + Math.floor(j / 6) * 22, 1.1);
  k += `<g transform="translate(${SC} ${RY + 150})"><rect x="-62" y="-11" width="124" height="22" rx="11" fill="#FFF7EC" stroke="${OUT}" stroke-width="1.3"/><text y="5" text-anchor="middle" font-size="12" font-weight="800" fill="${OUT}">${plates} plates ready</text></g>`;
  // stove
  k += `<rect x="${SXs}" y="${SY}" width="160" height="78" rx="10" fill="${city ? '#5B6670' : '#4A4E5A'}" stroke="${OUT}" stroke-width="1.8"/><rect x="${SXs + 6}" y="${SY + 64}" width="148" height="8" rx="3" fill="#3A3D47"/>`;
  [[34, 22], [80, 22], [126, 22], [34, 48], [80, 48], [126, 48]].forEach(([dx, dy], i) => k += `<circle cx="${SXs + dx}" cy="${SY + dy}" r="11" fill="${i === 1 ? '#E76F51' : '#2F323B'}" stroke="#1E2027" stroke-width="2"/>`);
  k += `<ellipse cx="${SXs + 80}" cy="${SY + 20}" rx="17" ry="10" fill="${city ? '#C9D1D6' : '#C27A4A'}" stroke="${OUT}" stroke-width="1.5"/><path d="M${SXs + 74} ${SY + 7} q-4 -8 0 -14 M${SXs + 86} ${SY + 7} q4 -8 0 -14" stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".85"/>`;
  k += `<g transform="translate(${SXs + 160} ${SY})"><rect x="-24" y="-10" width="48" height="20" rx="10" fill="#E76F51" stroke="${OUT}" stroke-width="1.2"/><text y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#FFF7EC">RUSH</text></g>`;
  // decor
  if (id === 'country1') {
    for (let i = 0; i < 4; i++) k += `<g transform="translate(${KR - 96 + i * 20} ${RY + 6})"><path d="M0 0 V10" stroke="${OUT}" stroke-width="1"/><circle cy="18" r="9" fill="#C27A4A" stroke="${OUT}" stroke-width="1.3"/><rect x="-1.5" y="6" width="3" height="5" fill="#7A4A2A"/></g>`;
    k += `<g transform="translate(${KX + 52} ${SY + 140})"><rect x="-26" y="-14" width="52" height="30" rx="5" fill="#A0673F" stroke="${OUT}" stroke-width="1.5"/><path d="M-26 0 h52" stroke="#7A4A2A" stroke-width="2"/><circle cx="-14" cy="-14" r="7" fill="#E63946" stroke="${OUT}" stroke-width="1"/><circle cx="0" cy="-16" r="6" fill="#84A98C" stroke="${OUT}" stroke-width="1"/><path d="M12 -12 l6 -10 l4 2 Z" fill="#F4A261" stroke="${OUT}" stroke-width="1"/></g>`;
    k += `<g transform="translate(${KX + 40} ${RY + RH - 40})"><path d="M-16 20 C-22 -4 -16 -18 0 -18 C16 -18 22 -4 16 20 Z" fill="#E9DFD3" stroke="${OUT}" stroke-width="1.5"/><text y="6" text-anchor="middle" font-size="9" font-weight="900" fill="#7A5A40">FLOUR</text></g>`;
  } else if (id === 'country2') {
    for (let i = 0; i < 3; i++) k += plant(KX + 44 + i * 30, RY + 30, .55, '#C4693F');
    k += `<g transform="translate(${KX + 54} ${SY + 140})"><ellipse rx="26" ry="10" fill="#C08552" stroke="${OUT}" stroke-width="1.4"/><ellipse cx="-8" cy="-4" rx="10" ry="6" fill="#E9B872" stroke="${OUT}" stroke-width="1"/><ellipse cx="8" cy="-3" rx="10" ry="6" fill="#DDA45D" stroke="${OUT}" stroke-width="1"/></g>`;
  } else if (id === 'city1') {
    k += `<rect x="${KX + 24}" y="${RY + 10}" width="${KR - KX - 48}" height="26" rx="4" fill="#FFFFFF" stroke="#C9D1D6" stroke-width="1.4"/>`;
    for (let i = 0; i < 6; i++) k += `<path d="M${KX + 40 + i * 40} ${RY + 14} v14" stroke="#9AA3AD" stroke-width="3" stroke-linecap="round"/>`;
    k += `<g transform="translate(${KX + 56} ${SY + 140})"><rect x="-30" y="-12" width="60" height="24" rx="4" fill="#C9D1D6" stroke="${OUT}" stroke-width="1.5"/><ellipse cx="-12" cy="-2" rx="8" ry="5" fill="#9AA3AD" stroke="${OUT}" stroke-width="1"/><rect x="4" y="-7" width="18" height="10" rx="2" fill="#F4E3B0" stroke="${OUT}" stroke-width="1"/></g>`;
  } else {
    k += `<rect x="${KX + 24}" y="${RY + 10}" width="${KR - KX - 48}" height="10" rx="3" fill="#8A5A3C" stroke="${OUT}" stroke-width="1.2"/>`;
    for (let i = 0; i < 7; i++) k += `<rect x="${KX + 36 + i * 34}" y="${RY + 2}" width="16" height="10" rx="2" fill="${['#2A9D8F', '#F4B740', '#E76F51', '#FFFFFF'][i % 4]}" stroke="${OUT}" stroke-width="1"/>`;
    k += plant(KX + 44, SY + 160, .9, '#FFFFFF');
  }
  k += `<rect x="${KX + 120}" y="${DY}" width="${KR - KX - 144}" height="128" rx="12" fill="rgba(255,247,236,.7)" stroke="#7A5A40" stroke-width="2" stroke-dasharray="7 5"/><text x="${KX + 120 + (KR - KX - 144) / 2}" y="${DY + 20}" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.5" fill="#7A5A40">DELIVERY PICKUP</text>`;
  return k;
}

function scene(id) {
  const T = THEMES[id], city = T.loc === 'city', cols = city ? 4 : 5, MC = city ? P2 : P1;
  let g = DEFS.replace('</defs>', tileDef + '</defs>');
  g += outside(id);
  // room
  g += `<rect x="${RX}" y="${RY}" width="${RW}" height="${RH}" rx="12" fill="${T.floor}"/><rect x="${KX}" y="${RY}" width="${KR - KX}" height="${RH}" fill="${T.kfloor}"/>`;
  const runner = T.runner || (city ? (id === 'city1' ? '#2A2A30' : '#2A9D8F') : (id === 'country1' || id === 'country3' ? '#B5523B' : '#84A98C'));
  g += `<rect x="${RX}" y="${AY[0] + 6}" width="${KX - RX}" height="${AY[1] - AY[0] - 12}" fill="${runner}"/><rect x="${RX}" y="${AY[0] + 12}" width="${KX - RX}" height="${AY[1] - AY[0] - 24}" fill="none" stroke="${city ? '#F4B740' : '#FFF7EC'}" stroke-width="2" stroke-dasharray="10 6" opacity=".8"/>`;
  const wall = T.wall || (city ? '#2E3440' : '#5B4636');
  g += `<rect x="${RX}" y="${RY}" width="${RW}" height="${RH}" rx="12" fill="none" stroke="${wall}" stroke-width="12"/><path d="M${KX} ${RY} V${AY[0]} M${KX} ${AY[1]} V${RY + RH}" stroke="${wall}" stroke-width="10"/>`;
  g += `<rect x="${RX - 8}" y="${AY[0]}" width="16" height="${AY[1] - AY[0]}" fill="${runner}"/><rect x="${KX - 6}" y="${AY[0]}" width="12" height="${AY[1] - AY[0]}" fill="${runner}"/>`;
  // windows in the outer wall
  for (let x = RX + 90; x < KX - 40; x += 200) g += `<rect x="${x}" y="${RY - 5}" width="60" height="10" rx="2" fill="#BFE3F2" stroke="${OUT}" stroke-width="1.2"/><rect x="${x}" y="${RY + RH - 5}" width="60" height="10" rx="2" fill="#BFE3F2" stroke="${OUT}" stroke-width="1.2"/>`;
  g += `<g transform="translate(${id.startsWith('city3') ? 146 : 118} ${id.startsWith('city3') ? AY[0] - 100 : AY[0] - 96})"><rect x="-58" y="-14" width="116" height="26" rx="6" fill="${id.startsWith('city3') ? '#FFFFFF' : city ? '#2B2B30' : '#3A2A1E'}" stroke="${id.startsWith('city3') ? OUT : 'none'}" stroke-width="1.4"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" letter-spacing="${id.startsWith('city3') ? 3 : 0}" fill="${id.startsWith('city3') ? '#2F3440' : city ? '#FFD1E5' : '#FFE08A'}">${city ? 'CITY' : 'COUNTRYSIDE'}</text></g>`;
  g += interiorDecor(id);
  // sections
  const FX0 = RX + 22, FX1 = KX - 22, gap = 16, secW = (FX1 - FX0 - (cols - 1) * gap) / cols, rowY = [RY + 22, AY[1] + 14], secH = AY[0] - 10 - rowY[0];
  const staffed = city ? [0, 1, 2] : [0, 1, 2, 3], seated = city ? [0, 1, 2, 4] : [0, 1, 3, 4, 5, 7], adSeat = [3];
  const sideTint = city ? 'rgba(20,24,30,.18)' : 'rgba(58,42,30,.12)';
  for (let r = 0; r < 2; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c, x = FX0 + c * (secW + gap), y = rowY[r], on = staffed.includes(i);
    if (on) g += `<rect x="${x}" y="${y}" width="${secW}" height="${secH}" rx="16" fill="${T.rug || '#A9C79F'}" stroke="${OUT}" stroke-width="1.6"/><rect x="${x + 7}" y="${y + 7}" width="${secW - 14}" height="${secH - 14}" rx="11" fill="none" stroke="${T.rugLine || '#FFF7EC'}" stroke-width="2" stroke-dasharray="7 5" opacity=".75"/>`;
    else g += `<rect x="${x}" y="${y}" width="${secW}" height="${secH}" rx="16" fill="${sideTint}" stroke="${city ? '#55606B' : '#7A5A40'}" stroke-width="2" stroke-dasharray="8 6"/>`;
    for (let t = 0; t < 2; t++) { const idx = i * 2 + t; g += table(x + secW * (t ? .72 : .28), y + 92, T.table, seated.includes(idx), idx, adSeat.includes(idx) ? MC : '#B8A99A'); }
    if (on) g += at(x + secW / 2, y + secH - 18, 1, bunny(FACE, true));
    else g += `<g transform="translate(${x + secW / 2} ${y + secH - 30})"><rect x="-38" y="-12" width="76" height="24" rx="12" fill="#FFF7EC" stroke="${OUT}" stroke-width="1.4"/><text y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#7A5A40">no staff</text></g>`;
  }
  g += kitchen(id, city ? 5 : 6);
  // a couple of guests waiting, one bunny walking with a plate, the chef at the stove
  [[RX - 50, QY], [RX - 90, QY + 6]].forEach(([x, y], i) => g += at(x, y, 1, pawn(i ? MC : '#B8A99A')));
  g += at(RX + 380, AYc + 18, 1, bunny(FACE, false, true));
  g += at(SC, SY + 118, 1.25, chef(T.me, MC, FACE)) + `<g transform="translate(${SC} ${SY + 22})"><rect x="-22" y="-12" width="44" height="22" rx="11" fill="${MC}" stroke="${OUT}" stroke-width="1.4"/><text y="4" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">YOU</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}

const v = Q.get('v') || 'sheet';
const root = document.getElementById('root');
if (v === 'sheet') root.innerHTML = `<h1>Character faces · 3 styles</h1><p class="sub">Big on the left, in-game size on the right. Rugs, colours and pawns stay as they are.</p>` + sheet();
else root.innerHTML = `<h1>${THEMES[v].name}</h1><p class="sub">${THEMES[v].note}</p>` + scene(v);
</script></body></html>
